[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
markers =
    integration: requires running infrastructure services
    e2e: end-to-end pipeline tests
    unit: pure unit tests with no infra

filterwarnings =
    ignore:.*'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:DeprecationWarning
    ignore:.*'oneOf' deprecated.*:DeprecationWarning
    ignore:.*'parseString' deprecated.*:DeprecationWarning
    ignore:.*'resetCache' deprecated.*:DeprecationWarning
    ignore:.*'enablePackrat' deprecated.*:DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*
    ignore::DeprecationWarning:matplotlib.*:
    ignore::DeprecationWarning:pyparsing.*:
    ignore:.*Non-stationary starting autoregressive parameters.*:UserWarning
    ignore:.*Maximum Likelihood optimization failed to converge.*:UserWarning
    ignore:.*ConvergenceWarning.*
    ignore:.*Boolean Series key will be reindexed.*:UserWarning
    ignore:.*Could not infer format.*:UserWarning
    ignore:.*Precision loss occurred in moment calculation.*:RuntimeWarning
    ignore:.*PytestUnraisableExceptionWarning.*
    ignore:.*DeprecationWarning.*passlib.*
    ignore:.*bcrypt.*version.*:UserWarning
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning
    ignore:.*Pydantic.*:UserWarning
