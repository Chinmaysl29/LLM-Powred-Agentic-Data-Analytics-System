# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .
path_separator = os

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is any valid timezone name from python-dateutil or pytz.
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# Run the environment during revision generation so model metadata and the
# environment-derived database URL are always available to autogenerate.
revision_environment = true

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", meaning os.pathsep.
# If unspecified, the previous default value of ' ' is used.
version_path_separator = os

# the output encoding used when revisions are generated
# with the "revision" command
# output_encoding = utf-8

# This value is deliberately a placeholder. migrations/env.py replaces it with
# Settings.postgres_dsn, which is sourced from DATABASE_URL / POSTGRES_* env vars.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/ai_analyst


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
