name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests with Coverage
        run: |
          pytest tests/ --cov=backend --cov-report=xml --cov-fail-under=80

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit SAST Scan
        run: |
          pip install bandit
          bandit -r backend -ll

      - name: Run Dependency Audit
        run: |
          pip install pip-audit
          pip-audit

  docker-build:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ai-data-analyst-os-backend:${{ github.sha }}

  deploy:
    name: Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying release ${{ github.sha }} to production cluster..."
          python scripts/deploy.py --version ${{ github.sha }}

      - name: Post-Deploy Health Check
        run: |
          curl -f http://api.aidataanlayst.com/api/v1/health || exit 1

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed! Initiating rollback to previous stable tag..."
          python scripts/rollback.py
