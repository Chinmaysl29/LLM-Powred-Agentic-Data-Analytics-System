services:

  backend:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_analyst

    depends_on:
      - postgres
      - redis

    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ai_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma

    ports:
      - "8001:8000"

    volumes:
      - ./infrastructure/chroma:/chroma

volumes:
  postgres_data:
  frontend_node_modules:
