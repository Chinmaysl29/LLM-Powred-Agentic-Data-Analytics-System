services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    entrypoint: []
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

    # unless-stopped: restarts after crashes but not after docker compose stop
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_analyst
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # Allow the Vite dev server running in the frontend container
      FRONTEND_URL: http://localhost:5173

    depends_on:
      - postgres
      - redis
      - chromadb

    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./logs:/app/logs
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ai_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma

    ports:
      - "8001:8000"

    volumes:
      - ./infrastructure/chroma:/chroma

volumes:
  postgres_data:
  frontend_node_modules:
