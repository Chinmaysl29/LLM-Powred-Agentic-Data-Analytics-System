services:

  backend:
    build:
      context: ./backend

    ports:
      - "8400:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_analyst
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app/backend
      - ./datasets:/app/datasets

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: ai_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  redis:
    image: redis:7

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  chromadb:
    image: chromadb/chroma

    ports:
      - "8401:8000"

    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma

    volumes:
      - chroma_data:/chroma/chroma

    restart: unless-stopped

networks:
  default:
    name: ai-analyst-network

volumes:
  postgres_data:
  frontend_node_modules:
  chroma_data:
